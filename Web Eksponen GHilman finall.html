  /* ===== Header bergaya batik ===== */
  header.hero{
    background:transparent;
    background-image:none;
    color:var(--ink);
    text-align:center;
    padding:34px 18px 40px;
    border-bottom:none;
  }
  .logos{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .logos .logo{
    width:80px;height: 80px;;border-radius:100%;
    background:#fff;color:var(--brown);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:12px;overflow:hidden;
  }
  .logos .logo img{width:100%;height:100%;object-fit:contain}
  header.hero h1{font-size:clamp(34px,7vw,56px);letter-spacing:6px;color:var(--brown)}
  header.hero p{max-width:680px;margin:10px auto 0;font-size:clamp(14px,2.4vw,18px);color:var(--brown2)}

  main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:26px 16px 40px}

  /* ===== Beranda ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .card{
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:18px;
    padding:22px 18px;
    text-align:center;
    cursor:pointer;
    transition:transform .18s,box-shadow .18s,border-color .18s;
  }
  .card:hover,.card:focus-visible{transform:translateY(-5px);box-shadow:0 10px 22px rgba(74,44,20,.18);border-color:var(--gold);outline:none}
  .card .icon{
    width:78px;height:78px;margin:0 auto 12px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold),#e8c36a);
    display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:700;color:var(--brown);
  }
  .card h2{font-size:20px;color:var(--maroon);margin-bottom:6px}
  .card p{font-size:14.5px;color:#5b4630}

  .section-title{font-size:22px;color:var(--brown);margin:0 0 14px;text-align:center}

  /* ===== Halaman topik ===== */
  .backbtn{
    border:none;background:var(--brown2);color:#fff;
    padding:9px 18px;border-radius:999px;cursor:pointer;font-size:15px;margin-bottom:16px;
  }
  .backbtn:hover{background:var(--maroon)}
  .topic-head{text-align:center;margin-bottom:14px}
  .topic-head h2{font-size:clamp(24px,5vw,34px);color:var(--maroon)}
  .tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 20px}
  .tab{
    border:2px solid var(--brown2);background:transparent;color:var(--brown2);
    padding:9px 22px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px;
  }
  .tab.active,.tab:hover{background:var(--brown2);color:#fff}

  .panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:22px 20px}
  .panel h3{color:var(--maroon);margin:22px 0 8px;font-size:20px}
  .panel h3:first-child{margin-top:0}
  .panel p{margin:8px 0}
  .panel ul,.panel ol{margin:8px 0 8px 22px}
  .panel li{margin:4px 0}

  .box{border-radius:12px;padding:12px 16px;margin:12px 0}
  .box .label{font-weight:700;display:block;margin-bottom:4px}
  .def{background:#fff3d6;border-left:6px solid var(--gold)}
  .rumus{background:#f3e8ff;border-left:6px solid #7b4fb3;text-align:center;font-size:19px}
  .contoh{background:#e9f5ec;border-left:6px solid var(--green)}
  .catatan{background:#fde9e6;border-left:6px solid var(--red)}

  table.tbl{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:center}
  table.tbl th{background:var(--brown2);color:#fff}
  .tablewrap{overflow-x:auto}

  /* notasi matematika */
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;line-height:1.25}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 5px}
  .frac>span:last-child{padding:0 5px}
  .ov{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
  sup{font-size:.72em}
  sub{font-size:.72em}

  /* ===== Video ===== */
  .flip-wrap{position:relative;height:78vh;min-height:480px;border-radius:14px;overflow:hidden;background:#000}
  .flip-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video-wrap{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000}
  .video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .btn{
    display:inline-block;border:none;cursor:pointer;text-decoration:none;
    background:var(--maroon);color:#fff;padding:11px 24px;border-radius:999px;font-size:15px;font-weight:600;
  }
  .btn:hover{background:var(--brown)}
  .btn.alt{background:var(--green)}

  /* ===== Grafik ===== */
  .graph-box{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
  .graph-box canvas{width:100%;height:auto;display:block;background:#fffdf7;border-radius:8px}
  .slider-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
  .slider-row input[type=range]{flex:1;min-width:160px;accent-color:var(--maroon)}
  .slider-row .val{font-weight:700;color:var(--maroon);min-width:70px}
  .graph-info{font-weight:600;color:var(--brown)}

  /* ===== Kuis ===== */
  .quiz-progress{display:flex;justify-content:space-between;font-weight:600;color:var(--brown2);margin-bottom:8px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar>div{height:100%;background:var(--gold);transition:width .3s}
  .q-text{font-size:19px;margin-bottom:14px}
  .opt{
    display:block;width:100%;text-align:left;
    background:#fff;border:2px solid var(--line);border-radius:12px;
    padding:11px 14px;margin:8px 0;cursor:pointer;font-size:16px;color:var(--ink);
  }
  .opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0}
  .opt.correct{background:#e1f4e7;border-color:var(--green)}
  .opt.wrong{background:#fde5e2;border-color:var(--red)}
  .opt:disabled{cursor:default}
  .explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff3d6;border-left:6px solid var(--gold)}
  .score{text-align:center;padding:10px 0}
  .score .big{font-size:56px;font-weight:800;color:var(--maroon)}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

  footer{text-align:center;padding:16px;background:var(--brown);color:#f2dfb5;font-size:14px}

  .hidden{display:none !important}
  @media (max-width:520px){
    .panel{padding:16px 13px}
    .rumus{font-size:17px}
  }
</style>

const app = document.getElementById('app');
let quizState = null;

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const [id, tab] = h.split('/');
  return { id: id || '', tab: tab || 'materi' };
}

function go(hash){ location.hash = hash; }

function render(){
  const { id, tab } = parseHash();
  const topic = TOPICS.find(t => t.id === id);
  window.scrollTo(0,0);
  if(id === 'elkpd'){ renderElkpd(); return; }
  if(!topic){ renderHome(); return; }
  renderTopic(topic, ['materi','video','kuis','E-Lkpd'].includes(tab) ? tab : 'materi');
}

/* ---------- Kuis ---------- */
function startQuiz(topic, panel){
  quizState = { topic, panel, i: 0, score: 0, answered: false };
  showQuestion();
}

function showQuestion(){
  const { topic, panel, i } = quizState;
  const q = topic.quiz[i];
  const total = topic.quiz.length;
  quizState.answered = false;
  panel.innerHTML = `
    <div class="quiz-progress"><span>Soal ${i+1} dari ${total}</span><span>Skor: ${quizState.score}</span></div>
    <div class="bar"><div style="width:${(i/total)*100}%"></div></div>
    <div class="q-text">${q.q}</div>
    <div id="opts">
      ${q.o.map((t, k) => `<button class="opt" data-k="${k}">${String.fromCharCode(65+k)}. ${t}</button>`).join('')}
    </div>
    <div id="fb"></div>`;
  panel.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k){
  if(quizState.answered) return;
  quizState.answered = true;
  const { topic, panel, i } = quizState;
  const q = topic.quiz[i];
  const ok = k === q.a;
  if(ok) quizState.score++;
  panel.querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if(idx === q.a) b.classList.add('correct');
    else if(idx === k) b.classList.add('wrong');
  });
  const last = i === topic.quiz.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="explain"><b>${ok ? 'Benar!' : 'Belum tepat.'}</b> ${q.e}</div>
    <div class="actions"><button class="btn" id="next">${last ? 'Lihat Hasil' : 'Soal Berikutnya →'}</button></div>`;
  document.getElementById('next').onclick = () => {
    if(last) showResult(); else { quizState.i++; showQuestion(); }
  };
}

function showResult(){
  const { topic, panel, score } = quizState;
  const total = topic.quiz.length;
  const pct = Math.round(score / total * 100);
  const msg = pct === 100 ? 'Luar biasa! Semua jawaban benar.'
            : pct >= 60  ? 'Bagus! Pelajari lagi bagian yang masih salah.'
            : 'Ayo pelajari materinya sekali lagi, lalu coba lagi.';
  panel.innerHTML = `
    <div class="score">
      <p>Hasil Kuis ${topic.title}</p>
      <div class="big">${score} / ${total}</div>
      <p>Nilai: <b>${pct}</b></p>
      <p>${msg}</p>
      <div class="actions">
        <button class="btn" id="retry">Ulangi Kuis</button>
        <button class="btn alt" id="tomateri">Baca Materi</button>
      </div>
    </div>`;
  document.getElementById('retry').onclick = () => startQuiz(topic, panel);
  document.getElementById('tomateri').onclick = () => go('#/' + topic.id + '/materi');
}

function initGraph(){
  const slot = document.getElementById('graph-slot');
  slot.innerHTML = `
    <div class="graph-box">
      <div class="slider-row">
        <label for="aRange"><b>Basis a</b></label>
        <input type="range" id="aRange" min="0.2" max="4" step="0.1" value="2">
        <span class="val" id="aVal">a = 2</span>
      </div>
      <canvas id="cv" width="640" height="400"></canvas>
      <p class="graph-info" id="gInfo"></p>
    </div>`;
  const range = document.getElementById('aRange');
  const draw = () => drawGraph(parseFloat(range.value));
  range.addEventListener('input', draw);
  draw();
}

function drawGraph(a){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const xmin = -4, xmax = 4, ymin = -1, ymax = 9;
  const X = x => (x - xmin) / (xmax - xmin) * W;
  const Y = y => H - (y - ymin) / (ymax - ymin) * H;

  document.getElementById('aVal').textContent = 'a = ' + a.toFixed(1);
  ctx.clearRect(0, 0, W, H);

  // kisi
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#eadfc6';
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#6b5a45';
  for(let x = Math.ceil(xmin); x <= xmax; x++){
    ctx.beginPath(); ctx.moveTo(X(x), 0); ctx.lineTo(X(x), H); ctx.stroke();
    if(x !== 0) ctx.fillText(x, X(x) - 4, Y(0) + 14);
  }
  for(let y = Math.ceil(ymin); y <= ymax; y++){
    ctx.beginPath(); ctx.moveTo(0, Y(y)); ctx.lineTo(W, Y(y)); ctx.stroke();
    if(y !== 0) ctx.fillText(y, X(0) + 5, Y(y) - 3);
  }

  // sumbu
  ctx.strokeStyle = '#4a2c14';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), H); ctx.stroke();
  ctx.fillStyle = '#4a2c14';
  ctx.fillText('x', W - 12, Y(0) - 6);
  ctx.fillText('y', X(0) + 8, 12);

  // asimtot y = 0
  ctx.strokeStyle = '#b3261e';
  ctx.setLineDash([6, 5]);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#b3261e';
  ctx.fillText('asimtot y = 0', W - 92, Y(0) + 16);

  const info = document.getElementById('gInfo');
  if(Math.abs(a - 1) < 0.001){
    // a = 1 : bukan fungsi eksponen
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, Y(1)); ctx.lineTo(W, Y(1)); ctx.stroke();
    info.textContent = 'Untuk a = 1, grafiknya garis lurus y = 1 (fungsi konstan), sehingga bukan fungsi eksponen.';
    return;
  }

  // kurva
  ctx.strokeStyle = '#7a2e1d';
  ctx.lineWidth = 3;
  ctx.beginPath();
  let started = false;
  for(let px = 0; px <= W; px++){
    const x = xmin + px / W * (xmax - xmin);
    const y = Math.pow(a, x);
    const py = Y(y);
    if(py < -50) { started = false; continue; }
    if(!started){ ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // titik (0,1)
  ctx.fillStyle = '#c9952b';
  ctx.beginPath(); ctx.arc(X(0), Y(1), 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4a2c14'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#4a2c14';
  ctx.fillText('(0, 1)', X(0) + 10, Y(1) - 8);

  info.textContent = a > 1
    ? 'a > 1 : grafik naik (makin ke kanan makin besar), selalu di atas sumbu X, dan melalui (0, 1).'
    : '0 < a < 1 : grafik turun (makin ke kanan makin kecil), selalu di atas sumbu X, dan melalui (0, 1).';
}



window.addEventListener('hashchange', render);
render();
</script>
